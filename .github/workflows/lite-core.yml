name: lite-core

# MaiBot Android 精简构建的持续集成
#
# 目标：
#   1. 校验核心链路可在"没有 Web 栈 / 没有科学计算栈"的环境下导入（门禁）
#   2. 为 arm64 交叉编译 10 个原生扩展并产出 wheel
#   3. 汇总 wheel 体积，供 Android 打包阶段评估 APK 增量
#
# 触发：push / PR / 手动

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_wheels:
        description: "是否编译 aarch64 wheel"
        type: boolean
        default: true

concurrency:
  group: lite-core-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_MINOR: "3.12"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 门禁：核心不得依赖重依赖
  # ─────────────────────────────────────────────────────────────
  gate:
    name: 核心依赖门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 不用 cache: pip —— 它会扫描仓库里的 lockfile，
          # 而本分支已移除 dashboard/（原 npm lockfile）等目录。
          cache: ""

      - name: 安装精简依赖
        run: |
          python -m pip install --upgrade pip
          # maim-message 的 METADATA 硬依赖 fastapi/aiohttp/websockets，但我们只用到
          # 它的纯数据模型（由 src/common/maim_lite.py 绕过 __init__）。
          # 因此先装其余依赖，最后单独 --no-deps 安装它。
          grep -v '^maim-message' requirements-lite.txt > /tmp/req-nomaim.txt
          python -m pip install -r /tmp/req-nomaim.txt
          python -m pip install --no-deps 'maim-message==0.6.8'

      - name: 确认重依赖确实不存在
        run: |
          python - <<'PY'
          import importlib.util as u
          # 这些是本分支刻意移除的重型栈，必须完全缺席：
          #   fastapi/uvicorn/starlette - WebUI 与官方 API server 专属
          #   pandas/scipy/pyarrow/faiss/playwright/matplotlib - 被剥离的科学计算栈
          heavy = ["fastapi", "uvicorn", "starlette", "pandas", "scipy",
                   "pyarrow", "faiss", "playwright", "matplotlib"]
          present = [n for n in heavy if u.find_spec(n) is not None]
          print("已安装的重依赖:", present or "无")
          if present:
              raise SystemExit(f"精简依赖里不应出现: {present}")

          # 以下为纯 Python 或有 aarch64 wheel，且是某个真实依赖的传递依赖，
          # 允许存在，但必须由门禁脚本证明"核心链路不导入它们"：
          #   aiohttp/websockets <- google-genai 的硬依赖
          allowed_transitive = ["aiohttp", "websockets"]
          print("允许存在的传递依赖:", [n for n in allowed_transitive
                                        if u.find_spec(n) is not None])
          PY

      - name: 运行核心门禁
        run: python scripts/check_lite_core.py --strict

      - name: 静态检查 —— 核心路径不得直接 import 重型包
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("src")
          pattern = re.compile(
              r"^\s*(?:from|import)\s+(fastapi|uvicorn|starlette|pandas|scipy|"
              r"pyarrow|faiss|playwright|matplotlib)\b", re.MULTILINE)
          hits = []
          for py in root.rglob("*.py"):
              if "__pycache__" in py.parts:
                  continue
              text = py.read_text(encoding="utf-8", errors="ignore")
              for m in pattern.finditer(text):
                  hits.append(f"{py}: {m.group(0).strip()}")
          if hits:
              print("发现直接重依赖导入:", *hits, sep="\n  ")
              sys.exit(1)
          print("OK: 核心路径无直接重依赖导入")
          PY

      - name: 校验禁用的子系统未被核心硬依赖
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # A_memorix 只能出现在过 optional_features 的延迟导入中
          bad = re.compile(r"^from\s+src\.A_memorix\.[\w.]+\s+import", re.MULTILINE)
          hits = []
          for py in pathlib.Path("src").rglob("*.py"):
              if "__pycache__" in py.parts or py.parts[1] == "A_memorix":
                  continue
              text = py.read_text(encoding="utf-8", errors="ignore")
              if bad.search(text):
                  hits.append(str(py))
          if hits:
              print("模块级硬导入 A_memorix:", *hits, sep="\n  ")
              sys.exit(1)
          print("OK: A_memorix 均为延迟导入")
          PY

  # ─────────────────────────────────────────────────────────────
  # 2. 交叉编译 aarch64 wheel
  # ─────────────────────────────────────────────────────────────
  wheels:
    name: 编译 aarch64 wheel
    if: github.event_name != 'pull_request' || inputs.build_wheels
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: numpy,         spec: "numpy>=2.2.6" }
          - { name: pydantic-core, spec: "pydantic-core>=2.46.3" }
          - { name: greenlet,      spec: "greenlet>=3.4.0" }
          - { name: pillow,        spec: "pillow>=12.3.0" }
          - { name: msgpack,       spec: "msgpack>=1.2.1" }
          - { name: rapidfuzz,     spec: "rapidfuzz>=3.14.5" }
          - { name: watchfiles,    spec: "watchfiles>=1.1.1" }
          - { name: zstandard,     spec: "zstandard>=0.25.0" }
          - { name: rpds-py,       spec: "rpds-py>=0.30.0" }
          - { name: cryptography,  spec: "cryptography>=50.0.1" }
    steps:
      # manylinux 容器是裸镜像，没有 node20，actions/checkout@v4 无法运行。
      # 用轻量的 wget 直接拉 tarball，避开 node 依赖。
      - name: 检出源码（容器内无 node，用 tarball）
        run: |
          set -eux
          mkdir -p src-checkout
          URL="https://ghfast.top/https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz"
          wget -q --timeout=120 --tries=3 "$URL" -O /tmp/src.tar.gz \
            || wget -q --timeout=120 --tries=3 \
                 "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}" \
                 -O /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C src-checkout --strip-components=1
          ls src-checkout | head

      - name: 检查目标架构
        working-directory: src-checkout
        run: |
          uname -m
          test "$(uname -m)" = "aarch64" || { echo "runner 非 aarch64"; exit 1; }

      - name: 选择 CPython 3.12
        run: |
          PY=/opt/python/cp312-cp312/bin/python
          "$PY" -V
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: 编译 wheel
        working-directory: src-checkout
        env:
          SPEC: ${{ matrix.spec }}
          NAME: ${{ matrix.name }}
        run: |
          set -eux
          mkdir -p wheelhouse
          if [ "$NAME" = "cryptography" ]; then
            # cryptography 为 Rust 实现，需要 rust 工具链
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustc -V
          fi
          python -m pip install --upgrade pip
          # 优先取官方 wheel；没有才源码编译
          python -m pip download --only-binary=:all: --dest wheelhouse \
            --platform manylinux_2_28_aarch64 --python-version 3.12 \
            --implementation cp --abi cp312 "$SPEC" \
            || python -m pip wheel --no-deps --wheel-dir wheelhouse "$SPEC"
          ls -lh wheelhouse

      - name: 体积统计
        working-directory: src-checkout
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            du -h wheelhouse/* | sort -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: src-checkout/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # 3. 汇总 wheel 体积，评估 APK 增量
  # ─────────────────────────────────────────────────────────────
  summarize:
    name: 汇总产物体积
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheel-*

      - name: 汇总
        run: |
          {
            echo "## aarch64 wheel 体积汇总"
            echo ""
            echo "| 包 | 文件 | 压缩后 |"
            echo "|---|---|---|"
            find artifacts -name '*.whl' -printf '%s\t%p\n' \
              | sort -rn \
              | while IFS=$'\t' read -r size path; do
                  printf '| %s | %s | %s |\n' \
                    "$(basename "$path" .whl | cut -d- -f1)" \
                    "$(basename "$path")" \
                    "$(numfmt --to=iec --suffix=B "$size")"
                done
            echo ""
            total=$(find artifacts -name '*.whl' -printf '%s\n' | awk '{s+=$1} END {print s+0}')
            echo "**合计: $(numfmt --to=iec --suffix=B "$total")**"
            echo ""
            echo "> 注：以上为 wheel 压缩体积。安装后解压体积通常为 2~3 倍。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: artifacts/**/*.whl
          retention-days: 30
